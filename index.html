<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JANコード読み取り</title>
<!-- バーコード解析ライブラリ（カメラ操作は使わず、解析だけに使う） -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 16px; max-width: 480px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; font-size: 18px; padding: 10px; border: 1px solid #999; border-radius: 6px; }
  button { font-size: 16px; padding: 10px 14px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; }
  select { flex: 1; font-size: 16px; padding: 8px; }
  input[type=range] { flex: 1; }
  .sub { margin-top: 10px; font-size: 14px; }
  [hidden] { display: none !important; }
  #view { position: relative; margin-top: 12px; width: 100%; background: #000; }
  #view video { display: block; width: 100%; }
  /* 読み取り範囲の目安（中央の横長の枠） */
  #frame { position: absolute; left: 10%; right: 10%; top: 30%; bottom: 30%;
           border: 2px solid #3fb950; border-radius: 4px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
  #msg { margin-top: 8px; font-size: 14px; color: #555; }
</style>
</head>
<body>

<label for="jan">JANコード</label>
<div class="row">
  <input id="jan" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="13" placeholder="例: 4901234567894">
  <button id="scanBtn" type="button">カメラで読む４</button>
</div>

<div id="camRow" class="row sub" hidden>
  <span>カメラ</span>
  <select id="camSel"></select>
</div>

<div id="zoomRow" class="row sub" hidden>
  <span>ズーム</span>
  <input id="zoom" type="range">
  <span id="zoomVal"></span>
</div>

<div id="view" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div id="frame"></div>
</div>
<div id="msg"></div>

<script>
const input = document.getElementById("jan");
const btn = document.getElementById("scanBtn");
const msg = document.getElementById("msg");
const camRow = document.getElementById("camRow");
const camSel = document.getElementById("camSel");
const zoomRow = document.getElementById("zoomRow");
const zoom = document.getElementById("zoom");
const zoomVal = document.getElementById("zoomVal");
const view = document.getElementById("view");
const video = document.getElementById("video");

let stream = null;          // カメラ映像
let timer = null;           // 読み取りループ
let selectedCamId = null;   // ユーザーが選んだカメラ
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

// バーコード解析の設定（JAN = EAN-13 / EAN-8 のみ）
const hints = new Map();
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8]);
hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
const reader = new ZXing.MultiFormatReader();
reader.setHints(hints);

// JAN（EAN-13 / EAN-8）のチェックディジット検証
function isValidJan(code) {
  if (!/^(\d{8}|\d{13})$/.test(code)) return false;
  const d = code.split("").map(Number);
  const check = d.pop();
  let sum = 0;
  d.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - (sum % 10)) % 10 === check;
}

// 読み取り後にEnterを押したのと同じ処理を実行する
function pressEnter(el) {
  ["keydown", "keypress", "keyup"].forEach(type => {
    el.dispatchEvent(new KeyboardEvent(type, {
      key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true, cancelable: true
    }));
  });
  if (el.form) {
    el.form.requestSubmit ? el.form.requestSubmit() : el.form.submit();
  }
}

// カメラ一覧を取得し、背面カメラのIDを返す（診断ページで映った方法と同じ）
async function prepareCameras() {
  const s = await navigator.mediaDevices.getUserMedia({ video: true }); // 許可を得てカメラ名を取得
  s.getTracks().forEach(t => t.stop());
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");

  camSel.innerHTML = "";
  cams.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = c.deviceId;
    o.textContent = c.label || ("カメラ" + (i + 1));
    camSel.appendChild(o);
  });
  camRow.hidden = cams.length < 2;

  const isBack = c => /背面|back|rear/i.test(c.label);
  const isWide = c => /超広角|ultra/i.test(c.label);
  const back =
    cams.find(c => /^(背面カメラ|Back Camera)$/i.test(c.label.trim())) ||
    cams.find(c => isBack(c) && !isWide(c)) ||
    cams.find(isBack) ||
    cams[0];
  return back ? back.deviceId : null;
}

async function startScan() {
  btn.textContent = "停止";
  msg.textContent = "バーコードを緑の枠内に横向きで合わせてください";
  try {
    const camId = selectedCamId || await prepareCameras();
    camSel.value = camId;
    stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: camId } }, audio: false
    });
    video.srcObject = stream;
    view.hidden = false;
    await video.play();
    setupZoom();
    timer = setInterval(scanFrame, 150);
  } catch (e) {
    msg.textContent = "カメラを起動できません（" + e.name + "）。HTTPSで開いているか、カメラの許可を確認してください。";
    stopScan();
  }
}

function stopScan() {
  clearInterval(timer);
  timer = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  view.hidden = true;
  zoomRow.hidden = true;
  btn.textContent = "カメラで読む";
}

// 映像の中央（緑の枠の部分）を切り出して解析する
function scanFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const sx = vw * 0.1, sy = vh * 0.3, sw = vw * 0.8, sh = vh * 0.4;
  const scale = Math.min(1, 1280 / sw);
  canvas.width = Math.round(sw * scale);
  canvas.height = Math.round(sh * scale);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const lum = new Uint8ClampedArray(canvas.width * canvas.height);
  for (let i = 0, j = 0; j < lum.length; i += 4, j++) {
    lum[j] = (img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114) | 0;
  }

  let text;
  try {
    const src = new ZXing.RGBLuminanceSource(lum, canvas.width, canvas.height);
    text = reader.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText();
  } catch (e) {
    return; // 見つからなければ次のフレームへ
  }
  if (!isValidJan(text)) return;   // 誤読はスキップ

  stopScan();
  input.value = text;
  input.dispatchEvent(new Event("input", { bubbles: true }));
  msg.textContent = "読み取りました: " + text;
  if (navigator.vibrate) navigator.vibrate(100);
  pressEnter(input);               // Enterを自動実行
}

// ズーム（対応している場合のみスライダーを表示。起動時は変更しない）
function setupZoom() {
  zoomRow.hidden = true;
  const track = stream && stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  const caps = track.getCapabilities();
  if (!caps.zoom) return;
  const current = track.getSettings().zoom || caps.zoom.min;
  zoom.min = caps.zoom.min;
  zoom.max = Math.min(caps.zoom.max, 8);
  zoom.step = caps.zoom.step || 0.1;
  zoom.value = current;
  zoomVal.textContent = Number(current).toFixed(1) + "x";
  zoomRow.hidden = false;
}

zoom.addEventListener("input", () => {
  zoomVal.textContent = Number(zoom.value).toFixed(1) + "x";
  const track = stream && stream.getVideoTracks()[0];
  if (track) track.applyConstraints({ advanced: [{ zoom: Number(zoom.value) }] }).catch(() => {});
});

camSel.addEventListener("change", async () => {
  selectedCamId = camSel.value;
  if (stream) { stopScan(); await startScan(); }
});

btn.addEventListener("click", async () => {
  if (stream) { stopScan(); return; }
  await startScan();
});
</script>
</body>
</html>
